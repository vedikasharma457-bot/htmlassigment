
<!DOCTYPE html>
<html>
<head>
    <title>Product Specifications</title>
</head>
<body>
    <h1>Smartphone Product Details</h1>

    <table border="1" cellpadding="10">
        <caption>Product Specification Table</caption>

        <tr>
            <th>Specification</th>
            <th>Details</th>
        </tr>

        <tr>
            <td>Product Name</td>

        <tr>
            <td>Brand</td>

        <tr>

        <tr>

        </tr>

        <tr>
