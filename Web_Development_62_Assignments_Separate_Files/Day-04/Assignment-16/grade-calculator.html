<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

<h1>Grade Calculator</h1><form id="form"><label>Enter marks (0–100)</label><input id="marks" type="number" min="0" max="100" required><button>Calculate Grade</button></form><section id="result" aria-live="polite">Your result will appear here.</section>

</div>
<script>

document.querySelector("#form").addEventListener("submit",event=>{
 event.preventDefault();
 const marks=Number(document.querySelector("#marks").value);
 let grade;
 if(marks<0||marks>100){grade="Enter marks between 0 and 100.";}
 else if(marks>=90){grade="A+";}
 else if(marks>=80){grade="A";}
 else if(marks>=70){grade="B";}
 else if(marks>=60){grade="C";}
 else if(marks>=40){grade="D";}
 else{grade="Fail";}
 document.querySelector("#result").textContent="Result: "+grade;
});

</script>
</body>
</html>
<script src="script.js" defer></script>
