<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Navigation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

<header class="bar"><a class="brand" href="#">NOVA</a><button id="toggle" aria-expanded="false" aria-controls="links">☰</button><nav id="links"><a href="#home">Home</a><a href="#services">Services</a><a href="#about">About</a><a href="#contact">Contact</a></nav></header>
<section id="home"><h1>Responsive Navigation Menu</h1><p>Resize the browser to test the mobile menu.</p></section>

</div>
<script>

const toggle=document.querySelector("#toggle"),links=document.querySelector("#links");
toggle.addEventListener("click",()=>{const open=links.classList.toggle("open");toggle.setAttribute("aria-expanded",String(open));});

</script>
</body>
</html>
<script src="script.js" defer></script>
