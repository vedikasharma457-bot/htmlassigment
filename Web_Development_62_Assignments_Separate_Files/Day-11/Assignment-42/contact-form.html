<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

<h1>Contact Form</h1><form id="contact"><label>Name</label><input id="name" required><label>Email</label><input id="email" type="email" required><label>Message</label><textarea id="message" required></textarea><button>Submit</button></form><section id="summary" aria-live="polite"></section>

</div>
<script>

document.querySelector("#contact").addEventListener("submit",e=>{e.preventDefault();const data={name:document.querySelector("#name").value.trim(),email:document.querySelector("#email").value.trim(),message:document.querySelector("#message").value.trim()};const box=document.querySelector("#summary");box.replaceChildren();for(const [key,value] of Object.entries(data)){const p=document.createElement("p");p.textContent=key+": "+value;box.append(p);}});

</script>
</body>
</html>
<script src="script.js" defer></script>
