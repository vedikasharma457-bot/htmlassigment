<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Task Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

<header><h1>Student Task Planner</h1><p>Organize your assignments and study goals.</p></header>
<form id="taskForm"><input id="title" placeholder="Task title" required><select id="category"><option>Study</option><option>Assignment</option><option>Personal</option></select><input id="due" type="date"><button>Add Task</button></form>
<div class="filters"><button data-filter="all">All</button><button data-filter="active">Active</button><button data-filter="done">Completed</button></div><p id="count"></p><ul id="tasks"></ul>

</div>

function persist(){localStorage.setItem(KEY,JSON.stringify(tasks));}
